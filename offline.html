<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — Consumer Rising</title>
<meta name="theme-color" content="#D93A2B">
<link rel="stylesheet" href="/css/style.css?v=11">
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#D93A2B">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Consumer Rising">
</head>
<body>
<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="kicker">No connection</span>
      <h1>You're offline</h1>
      <p class="lead">Consumer Rising needs a connection for fresh findings — but anything you've already opened is saved on your device. Reconnect and keep going.</p>
      <p class="center mt"><a class="btn" href="/">Try the homepage</a></p>
    </div>
  </section>
</main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
